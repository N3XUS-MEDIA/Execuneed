name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/execuneed_test

jobs:
  verify:
    runs-on: ubuntu-latest

    # The lead-capture tests are integration tests against real Postgres. The
    # consent rules they cover are the ones we cannot afford to regress, so
    # they run in CI rather than skipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: execuneed_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the action reads packageManager from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/db typechecks against the generated client, so this must run
      # before typecheck.
      - run: pnpm db:generate
      - run: pnpm --filter @execuneed/db exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
